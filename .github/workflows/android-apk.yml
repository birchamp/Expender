name: Build Android APK

# Produces an APK you can download and install straight onto a phone —
# no computer, no Expo Go, no dev server on the same Wi-Fi.
on:
  workflow_dispatch:
  push:
    branches: [claude/expo-build-setup-64tsau]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify before building
        run: npm run verify

      # Generates android/ from app.json. The directory is gitignored, so it is
      # rebuilt from config every run rather than drifting.
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # Expo's template signs release builds with the debug keystore, which is
      # exactly what sideloading needs: a self-contained, installable APK with
      # the JS bundled in. Not a Play Store artifact.
      # A universal APK carries native code for all four ABIs and lands around
      # 105MB, of which a given phone uses a quarter. Every arm64 device since
      # ~2017 is covered by arm64-v8a alone; the tradeoff is that this APK will
      # not install on a 32-bit device or an x86 emulator.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        id: apk
        run: |
          src=android/app/build/outputs/apk/release/app-release.apk
          test -f "$src" || { echo "APK not found at $src"; find android -name '*.apk'; exit 1; }

          echo "Native ABIs present:"
          unzip -l "$src" | grep -oE 'lib/[^/]+/' | sort -u

          # The ABI filter is the entire point of this build. If the property
          # ever stops being honoured the build still succeeds, so fail loudly
          # here rather than quietly shipping a 105MB universal APK again.
          if unzip -l "$src" | grep -qE 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "::error::APK contains non-arm64 native libs — the reactNativeArchitectures filter did not apply."
            exit 1
          fi

          # A fixed filename keeps the download URL stable across builds, so a
          # link handed to someone once keeps resolving to the current APK.
          # The commit it came from is recorded in the release body instead.
          mkdir -p out
          cp "$src" out/expender-android-arm64.apk
          echo "path=out/expender-android-arm64.apk" >> "$GITHUB_OUTPUT"
          ls -lh out/

      # action-gh-release adds files without removing what is already attached,
      # so without this the release accumulates one APK per build — including
      # the stale 105MB universal one.
      - name: Remove previously attached APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/android-latest" \
                  --jq '.assets[].id' 2>/dev/null || true)
          for id in $ids; do
            echo "Deleting stale asset $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: expender-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # The artifact above downloads as a .zip, which is awkward on a phone.
      # This release gives a direct .apk link Android can install on tap.
      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Expender — latest Android build
          body: |
            Install straight onto an Android phone: tap the `.apk` below,
            allow installs from your browser when prompted, and open it.

            Built for **arm64-v8a**, which covers essentially every Android
            phone made since 2017. It will not install on a 32-bit device or
            an x86 emulator — build a universal APK for those.

            Built from `${{ github.sha }}`.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
